[project]
name = "indoor-positioning-platform-backend"
version = "0.1.0"
description = "Core domain and persistence for the Indoor Positioning Platform"
requires-python = ">=3.11,<3.13"
dependencies = [
    "FastAPI>=0.115,<1.0",
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "bcrypt>=4.0,<6.0",
    "PyJWT>=2.10,<3.0",
    "python-dotenv>=1.0,<2.0",
    "scikit-learn>=1.3,<2.0",
    "numpy>=1.26,<2.3",
    "joblib>=1.3,<2.0",
    "uvicorn>=0.34,<1.0",
    "python-multipart>=0.0.20,<1.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-timeout>=2.3,<3.0",
    "ruff>=0.9",
    "black>=25.0",
    "mypy>=1.14",
    "httpx>=0.28,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that hit the database (deselect with '-m \"not integration\"')",
    "performance: marks performance benchmarks (deselect with '-m \"not performance\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"app/api/**" = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app"]
